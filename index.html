<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudStream - Multimedia Repository</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #444457; color: #fff; min-height: 100vh; }
        header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        header h1 { font-size: 28px; color: #00d4ff; letter-spacing: 2px; }
        header p { color: #888; font-size: 14px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .upload-section { background: #1a1a2e; border-radius: 12px; padding: 30px; margin-bottom: 40px; border: 1px solid #333; }
        .upload-section h2 { color: #00d4ff; margin-bottom: 20px; font-size: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        label { color: #aaa; font-size: 13px; }
        input, select, textarea { background: #0f0f1a; border: 1px solid #333; border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 14px; outline: none; transition: border 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: #00d4ff; }
        .file-drop { border: 2px dashed #333; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; transition: all 0.2s; background: #0f0f1a; }
        .file-drop:hover { border-color: #00d4ff; background: #0a0a15; }
        .file-drop p { color: #666; font-size: 14px; }
        .file-drop p span { color: #00d4ff; }
        #fileInput { display: none; }
        .btn { padding: 12px 28px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0080ff); color: #fff; }
        .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-danger { background: #ff4444; color: #fff; padding: 6px 14px; font-size: 12px; }
        .btn-edit { background: #ff8800; color: #fff; padding: 6px 14px; font-size: 12px; }
        .btn-danger:hover { background: #cc0000; }
        .btn-edit:hover { background: #cc6600; }
        .progress-bar { width: 100%; background: #333; border-radius: 4px; height: 6px; margin-top: 10px; display: none; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #00d4ff, #0080ff); border-radius: 4px; width: 0%; transition: width 0.3s; }
        .media-section h2 { color: #00d4ff; margin-bottom: 20px; font-size: 20px; }
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .media-card { background: #1a1a2e; border-radius: 12px; overflow: hidden; border: 1px solid #333; transition: transform 0.2s, box-shadow 0.2s; }
        .media-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,212,255,0.15); }
        .media-preview { width: 100%; height: 180px; object-fit: cover; background: #0f0f1a; display: flex; align-items: center; justify-content: center; }
        .media-preview img { width: 100%; height: 180px; object-fit: cover; }
        .media-preview .file-icon { font-size: 48px; color: #333; }
        .media-info { padding: 15px; }
        .media-info h3 { font-size: 15px; color: #fff; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-info p { font-size: 12px; color: #666; margin-bottom: 4px; }
        .media-info .tag { display: inline-block; background: #0f0f1a; border: 1px solid #333; border-radius: 4px; padding: 2px 8px; font-size: 11px; color: #00d4ff; margin: 2px; }
        .media-actions { display: flex; gap: 8px; margin-top: 12px; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #1a1a2e; border: 1px solid #00d4ff; border-radius: 8px; padding: 14px 20px; color: #fff; font-size: 14px; z-index: 9999; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.error { border-color: #ff4444; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: #1a1a2e; border-radius: 12px; padding: 30px; width: 400px; border: 1px solid #333; }
        .modal-content h3 { color: #00d4ff; margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .btn-secondary { background: #333; color: #fff; }
        .empty-state { text-align: center; padding: 60px; color: #444; }
        .empty-state p { font-size: 16px; margin-top: 10px; }
        .stats-bar { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat { background: #1a1a2e; border-radius: 8px; padding: 15px 20px; border: 1px solid #333; flex: 1; text-align: center; }
        .stat h3 { font-size: 24px; color: #00d4ff; }
        .stat p { font-size: 12px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>

<header>
    <div>
        <h1>☁ CloudStream</h1>
        <p>Cloud-Native Multimedia Repository — COM682</p>
    </div>
    <div style="color:#666; font-size:13px; text-align:right;">
        Student: Md Lutfur Rahaman<br>
        B00909483
    </div>
</header>

<div class="container">

    <!-- Stats Bar -->
    <div class="stats-bar">
        <div class="stat"><h3 id="totalCount">0</h3><p>Total Media Files</p></div>
        <div class="stat"><h3 id="imageCount">0</h3><p>Images</p></div>
        <div class="stat"><h3 id="videoCount">0</h3><p>Videos</p></div>
        <div class="stat"><h3 id="otherCount">0</h3><p>Other Files</p></div>
    </div>

    <!-- Upload Section -->
    <div class="upload-section">
        <h2>📤 Upload Media</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>Title *</label>
                <input type="text" id="title" placeholder="Enter media title" />
            </div>
            <div class="form-group">
                <label>Category *</label>
                <select id="category">
                    <option value="">Select category</option>
                    <option value="image">Image</option>
                    <option value="video">Video</option>
                    <option value="audio">Audio</option>
                    <option value="document">Document</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tags (comma separated)</label>
                <input type="text" id="tags" placeholder="e.g. nature, landscape, travel" />
            </div>
            <div class="form-group">
                <label>Uploaded By</label>
                <input type="text" id="uploadedBy" placeholder="Your name" value="Lutfur Rahaman" />
            </div>
            <div class="form-group full">
                <label>Select File *</label>
                <div class="file-drop" onclick="document.getElementById('fileInput').click()">
                    <p id="fileLabel">Click to select or drop a file here — <span>Browse</span></p>
                    <input type="file" id="fileInput" accept="image/*,video/*,audio/*,.pdf,.doc,.docx" onchange="handleFileSelect(this)" />
                </div>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
        <div style="margin-top:20px;">
            <button class="btn btn-primary" onclick="uploadMedia()">Upload to CloudStream</button>
        </div>
    </div>

    <!-- Media Gallery -->
    <div class="media-section">
        <h2>🎬 Media Gallery <button class="btn btn-primary" style="font-size:12px;padding:6px 14px;margin-left:15px;" onclick="loadMedia()">Refresh</button></h2>
        <div class="media-grid" id="mediaGrid">
            <div class="empty-state"><p>Loading media...</p></div>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <h3>✏️ Edit Media</h3>
        <input type="hidden" id="editId" />
        <div class="form-group" style="margin-bottom:15px;">
            <label>Title</label>
            <input type="text" id="editTitle" />
        </div>
        <div class="form-group" style="margin-bottom:15px;">
            <label>Category</label>
            <select id="editCategory">
                <option value="image">Image</option>
                <option value="video">Video</option>
                <option value="audio">Audio</option>
                <option value="document">Document</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Tags</label>
            <input type="text" id="editTags" />
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    const FUNCTIONS_URL = 'https://cloudstreamfunctions-d5f6bpgzefbzhya2.italynorth-01.azurewebsites.net/api';
    let selectedFile = null;

    function handleFileSelect(input) {
        selectedFile = input.files[0];
        if (selectedFile) {
            document.getElementById('fileLabel').innerHTML = `Selected: <span>${selectedFile.name}</span> (${(selectedFile.size / 1024 / 1024).toFixed(2)} MB)`;
            const category = selectedFile.type.startsWith('image/') ? 'image' :
                             selectedFile.type.startsWith('video/') ? 'video' :
                             selectedFile.type.startsWith('audio/') ? 'audio' : 'document';
            document.getElementById('category').value = category;
        }
    }

    async function uploadMedia() {
        const title = document.getElementById('title').value.trim();
        const category = document.getElementById('category').value;
        const tags = document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean);
        const uploadedBy = document.getElementById('uploadedBy').value.trim();

        if (!title || !category || !selectedFile) {
            showToast('Please fill in all required fields and select a file', true);
            return;
        }

        try {
            showToast('Creating media record...');
            document.getElementById('progressBar').style.display = 'block';
            document.getElementById('progressFill').style.width = '20%';

            // Step 1: Create media record and get SAS URL
            const response = await fetch(`${FUNCTIONS_URL}/CreateMedia`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, category, tags, uploadedBy, fileName: selectedFile.name, fileType: selectedFile.type })
            });

            const data = await response.json();
            document.getElementById('progressFill').style.width = '50%';

            // Step 2: Upload file directly to Blob Storage using SAS URL
            showToast('Uploading file to Azure Blob Storage...');
            await fetch(data.sasUrl, {
                method: 'PUT',
                headers: { 'x-ms-blob-type': 'BlockBlob', 'Content-Type': selectedFile.type },
                body: selectedFile
            });

            document.getElementById('progressFill').style.width = '100%';
            showToast('✅ Media uploaded successfully!');

            // Reset form
            setTimeout(() => {
                document.getElementById('title').value = '';
                document.getElementById('tags').value = '';
                document.getElementById('category').value = '';
                document.getElementById('fileLabel').innerHTML = 'Click to select or drop a file here — <span>Browse</span>';
                document.getElementById('progressBar').style.display = 'none';
                document.getElementById('progressFill').style.width = '0%';
                selectedFile = null;
                loadMedia();
            }, 1000);

        } catch (error) {
            showToast('Upload failed: ' + error.message, true);
            document.getElementById('progressBar').style.display = 'none';
        }
    }

    async function loadMedia() {
        try {
            const response = await fetch(`${FUNCTIONS_URL}/GetAllMedia`);
            const items = await response.json();

            const grid = document.getElementById('mediaGrid');

            if (items.length === 0) {
                grid.innerHTML = '<div class="empty-state"><p>No media uploaded yet. Upload your first file above!</p></div>';
                return;
            }

            // Update stats
            document.getElementById('totalCount').textContent = items.length;
            document.getElementById('imageCount').textContent = items.filter(i => i.category === 'image').length;
            document.getElementById('videoCount').textContent = items.filter(i => i.category === 'video').length;
            document.getElementById('otherCount').textContent = items.filter(i => i.category !== 'image' && i.category !== 'video').length;

            grid.innerHTML = items.map(item => `
                <div class="media-card">
                    <div class="media-preview">
                        ${item.category === 'image'
                            ? `<img src="${item.blobUrl}" alt="${item.title}" onerror="this.parentElement.innerHTML='<div class=\\'file-icon\\'>🖼️</div>'" />`
                            : `<div class="file-icon">${item.category === 'video' ? '🎬' : item.category === 'audio' ? '🎵' : '📄'}</div>`
                        }
                    </div>
                    <div class="media-info">
                        <h3>${item.title}</h3>
                        <p>📁 ${item.category} • 👤 ${item.uploadedBy}</p>
                        <p>📅 ${new Date(item.uploadDate).toLocaleDateString()}</p>
                        <div>${(item.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
                        <div class="media-actions">
                            <button class="btn btn-edit" onclick="openEdit('${item.id}', '${item.title}', '${item.category}', '${(item.tags||[]).join(',')}')">✏️ Edit</button>
                            <button class="btn btn-danger" onclick="deleteMedia('${item.id}', '${item.uploadedBy}')">🗑️ Delete</button>
                            <a href="${item.blobUrl}" target="_blank" class="btn btn-secondary" style="padding:6px 14px;font-size:12px;text-decoration:none;">👁️ View</a>
                        </div>
                    </div>
                </div>
            `).join('');

        } catch (error) {
            document.getElementById('mediaGrid').innerHTML = '<div class="empty-state"><p>Error loading media. Check console.</p></div>';
            console.error(error);
        }
    }

    function openEdit(id, title, category, tags) {
        document.getElementById('editId').value = id;
        document.getElementById('editTitle').value = title;
        document.getElementById('editCategory').value = category;
        document.getElementById('editTags').value = tags;
        document.getElementById('editModal').classList.add('show');
    }

    function closeModal() {
        document.getElementById('editModal').classList.remove('show');
    }

    async function saveEdit() {
        const id = document.getElementById('editId').value;
        const title = document.getElementById('editTitle').value;
        const category = document.getElementById('editCategory').value;
        const tags = document.getElementById('editTags').value.split(',').map(t => t.trim());

        try {
            const response = await fetch(`${FUNCTIONS_URL}/UpdateMedia/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, category, tags })
            });

            if (response.ok) {
                showToast('✅ Media updated successfully!');
                closeModal();
                loadMedia();
            } else {
                showToast('Update failed', true);
            }
        } catch (error) {
            showToast('Update failed: ' + error.message, true);
        }
    }

    async function deleteMedia(id, uploadedBy) {
        if (!confirm('Are you sure you want to delete this media?')) return;

        try {
            const response = await fetch(`${FUNCTIONS_URL}/DeleteMedia/${id}`, { method: 'DELETE' });
            if (response.ok) {
                showToast('✅ Media deleted successfully!');
                loadMedia();
            } else {
                showToast('Delete failed', true);
            }
        } catch (error) {
            showToast('Delete failed: ' + error.message, true);
        }
    }

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast show' + (isError ? ' error' : '');
        setTimeout(() => toast.className = 'toast', 3000);
    }

    // Load media on page load
    loadMedia();
</script>

</body>
</html>
