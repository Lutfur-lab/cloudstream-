name: Deploy CloudStream to Azure Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Azure Functions Core Tools
        run: |
          npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Deploy via Azure Functions Core Tools
        run: |
          func azure functionapp publish cloudstreamfunctions --javascript --no-build
        env:
          AzureWebJobsStorage: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}