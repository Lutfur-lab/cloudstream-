name: Deploy CloudStream to Azure Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Zip artifact
        run: zip -r release.zip . -x "*.git*" -x ".github/*"

      - name: Deploy via Kudu ZIP deploy
        run: |
          curl -X POST \
            "https://cloudstreamfunctions-d5f6bpgzefbzhya2.scm.italynorth-01.azurewebsites.net/api/zipdeploy" \
            -u "${{ secrets.AZURE_DEPLOY_USER }}:${{ secrets.AZURE_DEPLOY_PASSWORD }}" \
            -T release.zip \
            -H "Content-Type: application/zip" \
            --fail \
            --verbose